name: p6-lab CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate configuration and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Gateway config is valid (nginx -t)
        run: docker run --rm -v "$PWD/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" --add-host read-service:127.0.0.1 --add-host write-service:127.0.0.1 nginx:1.27-alpine nginx -t
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write-path schema tests
        run: |
          pip install "jsonschema[format]==4.23.0" pytest==8.3.3
          pytest -v tests/
