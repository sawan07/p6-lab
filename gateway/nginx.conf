# Edge gateway (Cloud report 1.4, FR-2, SR-3):
#  - every request gets a correlation ID that follows it through the services
#  - rate limiting per client interface (token bucket), so one busy UI cannot starve the others
#  - reads and writes go to separate services (CQRS, FR-1)
events {}
http {
  map $http_x_client_ui $client_ui { default $http_x_client_ui; "" anonymous; }
  limit_req_zone $client_ui zone=per_ui_writes:1m rate=20r/s;     # writes: 20/s per UI
  limit_req_zone $client_ui zone=per_ui_reads:1m  rate=2000r/s;   # reads: generous
  limit_req_status 429;
  log_format traced '$remote_addr ui=$client_ui cid=$request_id "$request" $status ${request_time}s';
  access_log /dev/stdout traced;

  upstream read_service  { server read-service:8000; }
  upstream write_service { server write-service:8000; }

  server {
    listen 80;
    proxy_set_header X-Correlation-ID $request_id;
    add_header X-Correlation-ID $request_id always;
    proxy_read_timeout 2s;               # a slow read becomes a 504, as in load-test run 02

    location /read/  { limit_req zone=per_ui_reads  burst=2000 nodelay; proxy_pass http://read_service; }
    location /write/ { limit_req zone=per_ui_writes burst=10   nodelay; proxy_pass http://write_service; }
  }
}
