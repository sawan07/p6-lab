# Project 6 lab: the proof of concept in my Cloud report ("Deconstructing the Monolith"),
# on Docker instead of AWS. Three networks stand in for the VPC tiers (report 1.3.1):
#   edge    : the gateway (the only published port, http://localhost:8087)
#   private : the microservices; internal, no route to the internet
#   data    : database, read replica, cache and queue; internal, services only
name: p6-lab

x-db: &db
  image: postgres:16-alpine
  environment: { POSTGRES_DB: platform, POSTGRES_USER: platform, POSTGRES_PASSWORD: lab-only-password }
  volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  networks: [data]
  healthcheck: { test: ["CMD", "pg_isready", "-U", "platform"], interval: 3s, retries: 30 }

services:
  gateway:
    image: nginx:1.27-alpine
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8087:80"]
    networks: [edge, private]
    depends_on: [read-service, write-service]

  read-service:
    build: ./services
    image: p6-lab-services
    command: ["uvicorn", "read_service:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      REDIS_CLUSTER_READ_ENDPOINT: redis://redis:6379/0
      DB_READ_REPLICA_DSN: postgresql://platform:lab-only-password@read-replica/platform
      READ_THROUGH_CACHE: ${READ_THROUGH_CACHE:-false}
      REPLICA_POOL_SIZE: ${REPLICA_POOL_SIZE:-3}
    networks: [private, data]
    depends_on: { read-replica: { condition: service_healthy }, redis: { condition: service_started } }

  write-service:
    build: ./services
    image: p6-lab-services
    command: ["uvicorn", "write_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &aws { AWS_ENDPOINT_URL: "http://localstack:4566", AWS_DEFAULT_REGION: eu-west-2,
                        AWS_ACCESS_KEY_ID: test, AWS_SECRET_ACCESS_KEY: test }
    networks: [private, data]
    depends_on: { localstack: { condition: service_healthy } }

  worker:
    build: ./services
    image: p6-lab-services
    command: ["python", "worker.py"]
    environment:
      <<: *aws
      DB_PRIMARY_DSN: postgresql://platform:lab-only-password@db-primary/platform
    networks: [private, data]
    depends_on: { localstack: { condition: service_healthy }, db-primary: { condition: service_healthy } }

  db-primary: *db
  read-replica:              # stand-in: seeded with the same data, not live replication
    <<: *db
    deploy:
      replicas: ${READ_REPLICAS:-1}
  redis:
    image: redis:7.2-alpine
    networks: [data]
  localstack:                # SQS FIFO queue (stand-in for AWS SQS)
    image: localstack/localstack:3.8
    environment: { SERVICES: sqs }
    networks: [data]
    healthcheck: { test: ["CMD", "curl", "-sf", "localhost:4566/_localstack/health"], interval: 5s, retries: 30 }

  jmeter:                    # load test (report 3.2): docker compose run --rm jmeter ...
    image: justb4/jmeter:5.5
    volumes: ["./loadtest:/loadtest"]
    networks: [edge]
    profiles: ["test"]

networks:
  edge: {}
  private: { internal: true }
  data: { internal: true }
